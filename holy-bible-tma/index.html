<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Holy Bible</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: var(--tg-theme-bg-color, #0a0a0f);
  --text: var(--tg-theme-text-color, #d4d0c8);
  --hint: var(--tg-theme-hint-color, #666);
  --link: var(--tg-theme-link-color, #c8b880);
  --btn: var(--tg-theme-button-color, #c8b880);
  --btn-text: var(--tg-theme-button-text-color, #0a0a0f);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #12121f);
  --accent: #c8b880;
  --border: rgba(255,255,255,0.06);
  --verse-num: rgba(200,184,128,0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cormorant Garamond', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ─── Screens ─── */
.screen { display: none; padding: 16px 16px 100px; animation: fadeIn 0.2s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ─── Language Selector ─── */
.lang-header {
  text-align: center;
  padding: 24px 0 20px;
}
.lang-header h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.lang-header p {
  font-size: 14px;
  color: var(--hint);
  font-family: 'JetBrains Mono', monospace;
}
.lang-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.lang-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 10px;
  background: var(--secondary-bg);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.lang-item:active { transform: scale(0.97); }
.lang-item .lang-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--hint);
  min-width: 26px;
}
.lang-item .lang-name {
  font-size: 15px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── Books List ─── */
.section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(200,184,128,0.4);
  padding: 20px 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.book-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.book-item:active { background: var(--secondary-bg); }
.book-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--hint);
  min-width: 20px;
  text-align: right;
}
.book-name {
  font-size: 19px;
  color: var(--text);
  flex: 1;
}
.book-ch {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
}

/* ─── Chapter Grid ─── */
.ch-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 20px;
}
.ch-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.ch-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 46px;
  border-radius: 8px;
  background: var(--secondary-bg);
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.ch-cell:active {
  background: var(--accent);
  color: var(--bg);
  transform: scale(0.94);
}

/* ─── Reading View ─── */
.read-header {
  margin-bottom: 24px;
}
.read-book-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--accent);
}
.read-chapter-num {
  font-size: 15px;
  color: var(--hint);
  margin-top: 2px;
}
.verse {
  font-size: 21px;
  line-height: 1.65;
  margin-bottom: 14px;
  color: rgba(212,208,200,0.88);
}
.verse-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--verse-num);
  vertical-align: super;
  margin-right: 3px;
  user-select: none;
  cursor: pointer;
}
.verse-num:active { color: var(--accent); }

/* ─── Chapter Nav ─── */
.ch-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  margin-top: 16px;
  border-top: 1px solid var(--border);
}
.ch-nav-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: rgba(200,184,128,0.6);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 8px;
  transition: all 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.ch-nav-btn:active { background: var(--secondary-bg); color: var(--accent); }
.ch-nav-btn:disabled { opacity: 0.2; pointer-events: none; }
.ch-nav-home {
  font-size: 18px;
  color: var(--hint);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
}

/* ─── Inline selectors in reading view ─── */
.read-selector {
  display: inline-block;
  position: relative;
}
.read-selector button {
  background: none;
  border: none;
  color: var(--accent);
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  cursor: pointer;
  padding: 0;
  opacity: 0.7;
}
.read-selector button:after {
  content: ' ▾';
  font-size: 10px;
}
.dropdown {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: 4px;
  background: var(--secondary-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  max-height: 280px;
  overflow-y: auto;
  z-index: 100;
  min-width: 240px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.dropdown.show { display: block; }
.dropdown-item {
  display: block;
  width: 100%;
  padding: 10px 14px;
  font-size: 15px;
  color: var(--text);
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  font-family: 'Cormorant Garamond', serif;
}
.dropdown-item:active { background: rgba(200,184,128,0.1); }
.dropdown-item.active { color: var(--accent); }

.dropdown-ch {
  min-width: 200px;
  padding: 8px;
}
.dropdown-ch-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}
.dropdown-ch-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--hint);
  background: none;
  border: 1px solid var(--border);
  cursor: pointer;
}
.dropdown-ch-cell:active { background: var(--accent); color: var(--bg); }
.dropdown-ch-cell.active { border-color: var(--accent); color: var(--accent); }

/* ─── Share toast ─── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Loading ─── */
.loading {
  text-align: center;
  padding: 60px 0;
  color: var(--hint);
  font-size: 16px;
}

/* ─── RTL ─── */
[dir="rtl"] .verse { text-align: right; }
[dir="rtl"] .book-name { text-align: right; }
[dir="rtl"] .read-book-name { text-align: right; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::selection { background: rgba(200,184,128,0.25); }
</style>
</head>
<body>

<!-- ═══ Screen: Language Selection ═══ -->
<div id="langScreen" class="screen active">
  <div class="lang-header">
    <h1>✝ Holy Bible</h1>
    <p>49 translations</p>
  </div>
  <div id="langList" class="lang-grid"></div>
</div>

<!-- ═══ Screen: Books ═══ -->
<div id="booksScreen" class="screen">
  <div id="booksContent"></div>
</div>

<!-- ═══ Screen: Chapters ═══ -->
<div id="chaptersScreen" class="screen">
  <div id="chaptersContent"></div>
</div>

<!-- ═══ Screen: Reading ═══ -->
<div id="readScreen" class="screen">
  <div id="readContent"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
const API = 'https://the-holy-bible.pages.dev/translations';
const tg = window.Telegram?.WebApp;

// ─── State ───
let state = {
  screen: 'lang',       // lang | books | chapters | read
  translations: [],
  currentTrans: null,    // {code, language, name, rtl, books}
  books: [],             // from index.json
  currentBook: null,     // book object
  bookData: null,        // full book JSON (all chapters)
  currentChapter: 1,
  history: []            // navigation stack
};

// ─── Init Telegram ───
function initTelegram() {
  if (!tg) return;
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();

  tg.BackButton.onClick(() => goBack());
  updateBackButton();
}

function updateBackButton() {
  if (!tg) return;
  if (state.screen === 'lang') {
    tg.BackButton.hide();
  } else {
    tg.BackButton.show();
  }
}

function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light') tg.HapticFeedback.impactOccurred('light');
  else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
  else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
}

// ─── Navigation ───
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name + 'Screen').classList.add('active');
  state.screen = name;
  updateBackButton();
  closeAllDropdowns();
}

function pushScreen(name) {
  state.history.push(state.screen);
  showScreen(name);
}

function goBack() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  showScreen(prev);
  haptic('light');
}

// ─── Data Loading ───
async function loadTranslations() {
  const res = await fetch(`${API}/translations.json`);
  const data = await res.json();
  state.translations = data.translations.filter(t => t.books > 0);
  renderLanguages();
}

async function loadBooks(trans) {
  state.currentTrans = trans;
  localStorage.setItem('bible_lang', trans.code);
  showScreen('books');
  document.getElementById('booksContent').innerHTML = '<div class="loading">...</div>';
  pushScreen('books');

  const res = await fetch(`${API}/${trans.code}/index.json`);
  const data = await res.json();
  state.books = data.books;
  renderBooks();
}

async function loadBook(book) {
  state.currentBook = book;
  document.getElementById('chaptersContent').innerHTML = '<div class="loading">...</div>';
  pushScreen('chapters');
  haptic('light');

  const file = book.file.replace('.json', '');
  const res = await fetch(`${API}/${state.currentTrans.code}/books/${file}.json`);
  state.bookData = await res.json();
  renderChapters();
}

function openChapter(ch) {
  state.currentChapter = ch;
  pushScreen('read');
  renderReading();
  haptic('medium');
  window.scrollTo(0, 0);
}

// ─── Renderers ───
function renderLanguages() {
  const el = document.getElementById('langList');
  // Check saved language
  const saved = localStorage.getItem('bible_lang');
  const savedTrans = saved ? state.translations.find(t => t.code === saved) : null;
  if (savedTrans) {
    loadBooks(savedTrans);
    return;
  }

  el.innerHTML = state.translations.map(t => `
    <div class="lang-item" onclick="loadBooks(state.translations.find(x=>x.code==='${t.code}'))">
      <span class="lang-code">${t.language}</span>
      <span class="lang-name">${t.name}</span>
    </div>
  `).join('');
}

function renderBooks() {
  const dir = state.currentTrans.rtl ? 'rtl' : 'ltr';
  const ot = state.books.filter(b => b.number <= 39);
  const nt = state.books.filter(b => b.number > 39);

  const renderList = (books) => books.map(b => `
    <div class="book-item" onclick="loadBook(state.books.find(x=>x.file==='${b.file}'))" dir="${dir}">
      <span class="book-num">${b.number}</span>
      <span class="book-name">${b.name}</span>
      <span class="book-ch">${b.chapters}</span>
    </div>
  `).join('');

  document.getElementById('booksContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div>
        <div style="font-size:22px;font-weight:700;color:var(--accent)">${state.currentTrans.name}</div>
      </div>
      <div class="lang-item" onclick="changeLang()" style="padding:8px 12px;width:auto;cursor:pointer">
        <span class="lang-code">${state.currentTrans.language}</span>
        <span class="lang-name" style="font-size:13px">⇄</span>
      </div>
    </div>
    <div class="section-title">Old Testament</div>
    ${renderList(ot)}
    <div class="section-title" style="margin-top:16px">New Testament</div>
    ${renderList(nt)}
  `;
}

function renderChapters() {
  const dir = state.currentTrans.rtl ? 'rtl' : 'ltr';
  const total = Object.keys(state.bookData.chapters).length;

  let cells = '';
  for (let i = 1; i <= total; i++) {
    cells += `<div class="ch-cell" onclick="openChapter(${i})">${i}</div>`;
  }

  document.getElementById('chaptersContent').innerHTML = `
    <div class="ch-title" dir="${dir}">${state.currentBook.name}</div>
    <div class="ch-grid">${cells}</div>
  `;
}

function renderReading() {
  const dir = state.currentTrans.rtl ? 'rtl' : 'ltr';
  const ch = state.currentChapter;
  const verses = state.bookData.chapters[String(ch)];
  const totalCh = Object.keys(state.bookData.chapters).length;

  if (!verses) {
    document.getElementById('readContent').innerHTML = '<div class="loading">Chapter not found</div>';
    return;
  }

  const versesHtml = verses.map(v => `
    <div class="verse" dir="${dir}">
      <span class="verse-num" onclick="shareVerse(${v.verse})">${v.verse}</span>${v.text}
    </div>
  `).join('');

  // Build book dropdown
  const bookDropItems = state.books.map(b => `
    <button class="dropdown-item ${b.file === state.currentBook.file ? 'active' : ''}"
      onclick="switchBook('${b.file}')" dir="${dir}">${b.name}</button>
  `).join('');

  // Build chapter dropdown grid
  let chCells = '';
  for (let i = 1; i <= totalCh; i++) {
    chCells += `<button class="dropdown-ch-cell ${i === ch ? 'active' : ''}" onclick="switchChapter(${i})">${i}</button>`;
  }

  document.getElementById('readContent').innerHTML = `
    <div class="read-header">
      <div class="read-selector">
        <button class="read-book-name" onclick="toggleDrop('bookDrop')" dir="${dir}">${state.bookData.book}</button>
        <div id="bookDrop" class="dropdown">${bookDropItems}</div>
      </div>
      <div class="read-chapter-num">
        <span class="read-selector">
          <button onclick="toggleDrop('chDrop')" style="font-size:15px;color:var(--hint);font-family:'JetBrains Mono',monospace">
            Chapter ${ch}
          </button>
          <div id="chDrop" class="dropdown dropdown-ch">
            <div class="dropdown-ch-grid">${chCells}</div>
          </div>
        </span>
      </div>
    </div>
    ${versesHtml}
    <div class="ch-nav">
      <button class="ch-nav-btn" onclick="prevChapter()" ${ch <= 1 ? 'disabled' : ''}>← ${ch - 1}</button>
      <button class="ch-nav-home" onclick="goBack()">▦</button>
      <button class="ch-nav-btn" onclick="nextChapter()" ${ch >= totalCh ? 'disabled' : ''}>${ch + 1} →</button>
    </div>
  `;
}

// ─── Actions ───
function changeLang() {
  localStorage.removeItem('bible_lang');
  state.history = [];
  showScreen('lang');
  renderLanguages();
  haptic('light');
}

function switchBook(file) {
  const book = state.books.find(b => b.file === file);
  if (!book) return;
  closeAllDropdowns();
  state.currentBook = book;
  state.currentChapter = 1;

  // Load new book
  const slug = file.replace('.json', '');
  fetch(`${API}/${state.currentTrans.code}/books/${slug}.json`)
    .then(r => r.json())
    .then(data => {
      state.bookData = data;
      renderReading();
      window.scrollTo(0, 0);
      haptic('medium');
    });
}

function switchChapter(ch) {
  closeAllDropdowns();
  state.currentChapter = ch;
  renderReading();
  window.scrollTo(0, 0);
  haptic('light');
}

function prevChapter() {
  if (state.currentChapter > 1) {
    state.currentChapter--;
    renderReading();
    window.scrollTo(0, 0);
    haptic('light');
  }
}

function nextChapter() {
  const total = Object.keys(state.bookData.chapters).length;
  if (state.currentChapter < total) {
    state.currentChapter++;
    renderReading();
    window.scrollTo(0, 0);
    haptic('light');
  }
}

function shareVerse(verseNum) {
  const verses = state.bookData.chapters[String(state.currentChapter)];
  const v = verses.find(x => x.verse === verseNum);
  if (!v) return;

  const text = `${state.bookData.book} ${state.currentChapter}:${verseNum}\n\n«${v.text}»`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
    showToast('Copied ✓');
    haptic('success');
  }
}

// ─── Dropdowns ───
function toggleDrop(id) {
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('show');
  closeAllDropdowns();
  if (!wasOpen) el.classList.add('show');
}

function closeAllDropdowns() {
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.read-selector')) closeAllDropdowns();
});

// ─── Toast ───
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ─── Boot ───
initTelegram();
loadTranslations();
</script>
</body>
</html>
